name: Timeweb static asset probe

on:
  push:
    branches: [server-staging]
    paths:
      - ".github/workflows/timeweb-static-asset-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect public static asset metadata
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            'set -eu
             printf "%s\n" "=== REMOTE USER ==="
             id -un
             printf "%s\n" "=== PUBLIC ASSET METADATA ==="
             for asset in index.html app.js media-fallback.css; do
               path="/root/supabase-project/volumes/proxy/app/$asset"
               if test -r "$path"; then
                 stat -c "%n|%s|%y" "$path"
                 sha256sum "$path"
               else
                 printf "%s\n" "$path|UNREADABLE_OR_MISSING"
               fi
             done
             index="/root/supabase-project/volumes/proxy/app/index.html"
             if test -r "$index"; then
               printf "%s\n" "=== PUBLIC ASSET VERSION MARKERS ==="
               grep -Eo "(app\.js|styles\.css|media-fallback\.css)\?v=[^\" ]+" "$index" || true
             fi' \
            > timeweb-static-asset-probe.txt

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeweb-static-asset-probe
          path: timeweb-static-asset-probe.txt
          if-no-files-found: error
          retention-days: 1
