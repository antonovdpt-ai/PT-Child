name: Sync Fizira landing to Timeweb

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-fizira-landing.yml"
      - "landing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fizira-landing-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate committed landing and legal pages
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "<title>Fizira" landing/index.html
          grep -Fq "app.fizira.com" landing/index.html
          test -s landing/styles.css
          grep -Fq "FIZIRA_MOBILE_FIX_END" landing/styles.css
          test -s landing/script.js
          test -s landing/assets/fizira-logo-black.png
          test -s landing/favicon.ico
          for route in privacy terms consent data-processing delete-account; do
            test -s "landing/$route/index.html"
            grep -Fq "support@fizira.com" "landing/$route/index.html" || \
              grep -Fq "privacy@fizira.com" "landing/$route/index.html"
          done
          test -s landing/legal.css
          ! grep -R -E "будет создан позднее|\[УКАЗАТЬ|\[ОТЧЕСТВО|no-reply@fizira.com" landing
          tar -czf fizira-landing.tar.gz -C landing .

      - name: Export landing snapshot for responsive review
        uses: actions/upload-artifact@v4
        with:
          name: fizira-landing-snapshot
          path: fizira-landing.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Configure restricted SSH access
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload landing assets without changing Caddy or DNS
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_cache=".cache/fizira-landing"
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            "mkdir -p '$remote_cache'"
          scp \
            -P "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            fizira-landing.tar.gz \
            "$USER@$HOST:$remote_cache/$SHA.tar.gz"
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            "set -eu
             root='/root/supabase-project/volumes/proxy/app'
             target=\"\$root/landing\"
             release_sha='$SHA'
             archive=\"\$HOME/$remote_cache/\$release_sha.tar.gz\"
             stage=\"\$(mktemp -d \"\$root/.landing-stage.XXXXXX\")\"
             previous=\"\$root/.landing-previous-\$release_sha\"
             backup_root='/root/fizira-deploy-backups/landing'
             mkdir -p \"\$backup_root\"
             tar -xzf \"\$archive\" -C \"\$stage\"
             for asset in index.html styles.css script.js legal.css favicon.ico assets/fizira-logo-black.png privacy/index.html terms/index.html consent/index.html data-processing/index.html delete-account/index.html; do
               test -s \"\$stage/\$asset\"
             done
             if test -d \"\$target\"; then
               tar -czf \"\$backup_root/landing-before-\$release_sha.tar.gz\" -C \"\$target\" .
               mv \"\$target\" \"\$previous\"
             fi
             if ! mv \"\$stage\" \"\$target\"; then
               test ! -d \"\$previous\" || mv \"\$previous\" \"\$target\"
               exit 1
             fi
             if test -d \"\$previous\"; then rm -rf -- \"\$previous\"; fi
             rm -f \"\$archive\"
             test -s \"\$target/index.html\"
             test -s \"\$target/privacy/index.html\""

      - name: Verify landing and public legal routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "https://fizira.com/?release=${{ github.sha }}" | grep -F "Политика конфиденциальности"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "https://fizira.com/privacy?release=${{ github.sha }}" | grep -F "Версия 1.0"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "https://fizira.com/terms?release=${{ github.sha }}" | grep -F "Пользовательское соглашение"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "https://fizira.com/delete-account?release=${{ github.sha }}" | grep -F "Удаление аккаунта Fizira"
