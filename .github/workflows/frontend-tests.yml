name: Fizira frontend tests

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "cabinet.js"
      - "auth-domain.mjs"
      - "schedule-domain.mjs"
      - "schedule-editor.js"
      - "security-utils.mjs"
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "ops/pwa/**"
      - "styles.css"
      - "landing/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/deploy-fizira-frontend.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "cabinet.js"
      - "auth-domain.mjs"
      - "schedule-domain.mjs"
      - "schedule-editor.js"
      - "security-utils.mjs"
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "ops/pwa/**"
      - "styles.css"
      - "landing/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/deploy-fizira-frontend.yml"

permissions:
  contents: read

concurrency:
  group: fizira-frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generated PWA icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python ops/pwa/generate-icons.py
          python - <<'PY'
          from PIL import Image
          for size in (180, 192, 512):
              with Image.open(f"icons/icon-{size}.png") as icon:
                  assert icon.size == (size, size)
                  icon.verify()
          print("PWA_ICON_GENERATION_OK")
          PY

      - name: Test non-destructive live HTML overlay
        run: python -m unittest ops/pwa/test_patch_live_index.py

      - name: Check that live production matches main baseline
        if: ${{ github.event_name == 'pull_request' }}
        env:
          FIZIRA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash ops/pwa/check-live-baseline.sh

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test
