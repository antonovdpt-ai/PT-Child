name: Flower navigation mobile and desktop regression (one-shot)
# Temporary test-only runner. No production secrets, Timeweb or deployment.
on:
  push:
    branches:
      - fix/flower-navigation-20261015
    paths:
      - .github/workflows/flower-navigation-tests.yml
permissions:
  contents: read
jobs:
  verify-flower:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned dependencies and run complete JS suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
      - name: Provision matching Playwright Chromium for touch and desktop regression
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          bin="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux64/chrome' | head -n 1)"
          if [[ -z "$bin" ]]; then
            bin="$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)"
          fi
          test -n "$bin"
          printf 'CHROMIUM_EXECUTABLE=%s\n' "$bin" }} "$GITHUB_ENV"
      - name: Full browser flower mobile touchscreen and desktop scenarios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flower-screens"
          FLOWER_SCREENSHOT_DIR="$RUNNER_TEMP/flower-screens" node --test tests/patient-flower.browser.mjs
      - name: Save isolated screenshots and layout evidence for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flower-navigation-screens-${{ github.run_id }}
          path: ${{ runner.temp }}/flower-screens/
          retention-days: 5
          if-no-files-found: ignore
