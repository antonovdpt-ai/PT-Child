name: Fizira Android / RuStore candidate build

on:
  push:
    branches:
      - feature/android-rustore-20261115
    paths:
      - "android/**"
      - ".github/workflows/android-rustore-build.yml"
      - "fizira-symbol.png"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-rustore-build.yml"
      - "fizira-symbol.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fizira-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare brand icons and verify Android source
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python android/tools/generate-icons.py
          python android/tools/verify-release.py

      - name: Build internal test APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload internal test package (NOT for RuStore)
        uses: actions/upload-artifact@v4
        with:
          name: fizira-android-debug-internal-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload square logo for future store card
        uses: actions/upload-artifact@v4
        with:
          name: fizira-rustore-logo-512
          path: android/store-assets/fizira-rustore-icon-512.png
          if-no-files-found: error
          retention-days: 14
