name: Fizira release safety tests

on:
  pull_request:
    paths:
      - "app.js"
      - "security-utils.mjs"
      - "ops/account-deletion/**"
      - "ops/ai-evaluation/**"
      - "ops/schedule/**"
      - "ops/security/**"
      - "ops/release/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/release-safety-tests.yml"
  push:
    branches: [main, codex/task1-8-saved-20261004]
    paths:
      - "app.js"
      - "security-utils.mjs"
      - "ops/account-deletion/**"
      - "ops/ai-evaluation/**"
      - "ops/schedule/**"
      - "ops/security/**"
      - "ops/release/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/release-safety-tests.yml"

permissions:
  contents: read

concurrency:
  group: fizira-release-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Provision and validate reviewed parent cache baseline
        shell: bash
        run: bash ops/release/ensure-parent-portal-baseline.sh

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run security, AI, deletion and schedule checks
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' tests < <(
            find ops supabase -type f \
              \( -name '*.test.mjs' -o -name '*.test.js' \) \
              -print0 | sort -z
          )
          (( ${#tests[@]} > 0 ))
          node --test "${tests[@]}"

      - name: Check release shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' scripts < <(find ops/release -type f -name '*.sh' -print0 | sort -z)
          (( ${#scripts[@]} > 0 ))
          bash -n "${scripts[@]}"
