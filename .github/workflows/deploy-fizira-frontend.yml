name: Deploy Fizira frontend to Timeweb

# Manual only: app.js and ptchild-ai are a coupled production contract.
# Deploy them together after the production/source preflight passes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fizira-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run frontend regression tests
        run: |
          npm ci
          npm test

      - name: Require production legal recorder before registration deploy
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "record_legal_acceptances" app.js; then
            publishable_key="$(sed -n 's/^const SUPABASE_PUBLISHABLE_KEY = "\([^"]*\)";.*/\1/p' app.js)"
            test -n "$publishable_key"
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $publishable_key" \
              --header "Authorization: Bearer $publishable_key" \
              --header 'Content-Type: application/json' \
              --data '{"p_documents":[{"document_type":"terms","document_version":"schema-check"}],"p_source":"deployment-check"}' \
              https://auth.fizira.com/rest/v1/rpc/record_legal_acceptances)"
            case "$status" in
              400|401|403) ;;
              *) echo "Legal recorder production gate failed with HTTP $status" >&2; exit 1 ;;
            esac
          fi

      - name: Package public frontend assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            index.html
            app.js
            cabinet.js
            styles.css
            media-fallback.css
            auth-domain.mjs
            schedule-domain.mjs
            schedule-editor.js
            security-utils.mjs
            favicon.ico
            fizira-symbol.png
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          tar -czf fizira-frontend.tar.gz "${assets[@]}"
          grep -Eo 'app\.js\?v=[^"]+' index.html | head -n 1 > expected-app-marker.txt
          test -s expected-app-marker.txt

      - name: Configure restricted SSH access
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate public frontend
        id: activate
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_cache=".cache/fizira-frontend"
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            "mkdir -p '$remote_cache'"
          scp \
            -P "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            fizira-frontend.tar.gz \
            "$USER@$HOST:$remote_cache/$SHA.tar.gz"
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            "set -eu
             target='/root/supabase-project/volumes/proxy/app'
             release_sha='$SHA'
             archive=\"\$HOME/$remote_cache/\$release_sha.tar.gz\"
             backup_root=\"\$HOME/$remote_cache/backups\"
             backup=\"\$backup_root/frontend-\$release_sha-before.tar.gz\"
             stage=''
             cleanup_stage() {
               if [ -n \"\$stage\" ] && [ -d \"\$stage\" ]; then
                 rm -rf -- \"\$stage\"
               fi
             }
             trap cleanup_stage EXIT HUP INT TERM
             stage=\"\$(mktemp -d \"\$target/.fizira-stage.XXXXXX\")\"
             tar -xzf \"\$archive\" -C \"\$stage\"
             for asset in app.js cabinet.js styles.css media-fallback.css auth-domain.mjs schedule-domain.mjs schedule-editor.js security-utils.mjs favicon.ico fizira-symbol.png index.html; do
               test -f \"\$stage/\$asset\"
             done
             mkdir -p \"\$backup_root\"
             if [ ! -f \"\$backup\" ]; then
               tar -czf \"\$backup\" -C \"\$target\" \
                 app.js cabinet.js styles.css media-fallback.css auth-domain.mjs schedule-domain.mjs schedule-editor.js security-utils.mjs favicon.ico fizira-symbol.png index.html
               sha256sum \"\$backup\" > \"\$backup.sha256\"
             fi
             for asset in app.js cabinet.js styles.css media-fallback.css auth-domain.mjs schedule-domain.mjs schedule-editor.js security-utils.mjs favicon.ico fizira-symbol.png; do
               mv \"\$stage/\$asset\" \"\$target/\$asset\"
             done
             mv \"\$stage/index.html\" \"\$target/index.html\"
             rmdir \"\$stage\"
             stage=''
             rm -f \"\$archive\"
             echo \"backup=\$backup\""

      - name: Verify published version on the public domain
        id: verify
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_marker="$(cat expected-app-marker.txt)"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "https://app.fizira.com/?release=$SHA" \
            -o deployed-index.html
          grep -F "$expected_marker" deployed-index.html

      - name: Roll back frontend after a failed activation or verification
        if: ${{ failure() && (steps.activate.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -p "${PORT:-22}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$USER@$HOST" \
            "set -eu
             target='/root/supabase-project/volumes/proxy/app'
             release_sha='$SHA'
             backup=\"\$HOME/.cache/fizira-frontend/backups/frontend-\$release_sha-before.tar.gz\"
             test -f \"\$backup\" || exit 0
             rollback=''
             cleanup_rollback() {
               if [ -n \"\$rollback\" ] && [ -d \"\$rollback\" ]; then
                 rm -rf -- \"\$rollback\"
               fi
             }
             trap cleanup_rollback EXIT HUP INT TERM
             rollback=\"\$(mktemp -d \"\$target/.fizira-rollback.XXXXXX\")\"
             tar -xzf \"\$backup\" -C \"\$rollback\"
             for asset in app.js cabinet.js styles.css media-fallback.css auth-domain.mjs schedule-domain.mjs schedule-editor.js security-utils.mjs favicon.ico fizira-symbol.png index.html; do
               test -f \"\$rollback/\$asset\"
             done
             for asset in app.js cabinet.js styles.css media-fallback.css auth-domain.mjs schedule-domain.mjs schedule-editor.js security-utils.mjs favicon.ico fizira-symbol.png; do
               mv \"\$rollback/\$asset\" \"\$target/\$asset\"
             done
             mv \"\$rollback/index.html\" \"\$target/index.html\"
             rmdir \"\$rollback\"
             rollback=''
             echo \"rollback=\$backup\""
