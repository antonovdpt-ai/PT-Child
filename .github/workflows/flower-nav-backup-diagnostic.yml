name: Diagnose incomplete Flower 0.188 backup (read-only once)
# No release, no writes on Timeweb, no patient data, no remote command injection.
# Read-only check of direct-versus-anchored file opens, no writes or publication.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/flower-navigation-20261015
    paths:
      - .github/workflows/flower-nav-backup-diagnostic.yml
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Provision known SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect backup completion and permissions without reading contents
        shell: bash
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
        run: |
          set -euo pipefail
          ssh -T -p "$PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" "python3 -B -" <<'PY'
          from pathlib import Path
          import os,stat
          source=Path("/root/supabase-project/volumes/proxy/app")
          backup=Path.home()/".cache"/"fizira-frontend-snapshots"/"flower-nav-38791116267"
          copies=backup/"files"
          print("BACKUP_EXISTS="+str(backup.is_dir()))
          print("BACKUP_COMPLETE="+str((backup/"complete").is_file()))
          if backup.is_dir() and not backup.is_symlink():
              print("BACKUP_FILE_COPY_DIR="+str(copies.is_dir()))
              print("BACKUP_ITEMS="+",".join(sorted(p.name for p in backup.iterdir()) if len(list(backup.iterdir()))<15 else ["MORE_THAN_14"]))
              if copies.is_dir():
                  count=0;foreign=0
                  for root,dirs,files in os.walk(copies,followlinks=False):
                      for name in files:
                          info=os.lstat(os.path.join(root,name));count+=1;foreign+=int(info.st_uid!=os.geteuid())
                  print("BACKUP_COPIED_FILES="+str(count))
                  print("BACKUP_FOREIGN_UID="+str(foreign))
          print("SOURCE_READABLE="+str(source.is_dir() and os.access(source,os.R_OK|os.X_OK)))
          count=0;nonowned=0;nonregular=0;symlinks=0;directories=0;foreign_dirs=0
          for root,dirs,files in os.walk(source,followlinks=False):
              directories+=1
              for name in dirs:
                  p=os.path.join(root,name);info=os.lstat(p)
                  foreign_dirs+=int(info.st_uid!=os.geteuid())
                  symlinks+=int(stat.S_ISLNK(info.st_mode))
              for name in files:
                  info=os.lstat(os.path.join(root,name));count+=1
                  nonowned+=int(info.st_uid!=os.geteuid())
                  nonregular+=int(not stat.S_ISREG(info.st_mode))
          print("SOURCE_FILES="+str(count))
          print("SOURCE_NONOWNED_FILES="+str(nonowned))
          print("SOURCE_DIRS="+str(directories))
          print("SOURCE_FOREIGN_DIRS="+str(foreign_dirs))
          print("SOURCE_NONREGULAR="+str(nonregular))
          print("SOURCE_SYMLINKS="+str(symlinks))
          backups=Path.home()/".cache"/"fizira-frontend-snapshots"
          print("BACKUP_ROOT_EXISTS="+str(backups.is_dir()))
          print("BACKUP_ROOT_OWNED_BY_SSH="+str(backups.stat().st_uid==os.geteuid()))
          print("BACKUP_ROOT_WRITABLE="+str(os.access(backups,os.W_OK|os.X_OK)))
          original=Path.home()/".cache"/"fizira-flower-nav"/"38791116267"/"original-four"
          print("ORIGINAL_COPY_FOLDER_EXISTS="+str(original.is_dir()))
          if original.is_dir():
              print("ORIGINAL_COPY_FILES="+str(len([p for p in original.iterdir() if p.is_file()])))
              print("ORIGINAL_FOLDER_WRITABLE="+str(os.access(original,os.W_OK|os.X_OK)))
          import importlib.util
          tool=Path.home()/".cache"/"fizira-flower-nav"/"38791116267"/"frontend-snapshot.py"
          spec=importlib.util.spec_from_file_location("snapshot_diagnostic",tool)
          snap=importlib.util.module_from_spec(spec);spec.loader.exec_module(snap)
          for mode,label in (("direct","DIRECT_APPJS"),("descriptor","ANCHORED_APPJS")):
              try:
                  if mode=="direct":fd=os.open(source/"app.js",os.O_RDONLY|os.O_NOFOLLOW)
                  else:fd=snap.open_nofollow(source/"app.js",os.O_RDONLY)
                  os.close(fd)
                  print(label+"=PASS")
              except OSError as err:
                  print(label+"_STOP="+type(err).__name__)
                  print(label+"_ERRNO="+str(getattr(err,"errno","NONE")))
          try:
              files,dirs=snap.inventory(source)
              print("SNAPSHOT_INVENTORY=PASS")
              print("INVENTORY_FILES="+str(len(files)))
              try:
                  meta=snap.directory_metadata(source,dirs)
                  print("SNAPSHOT_DIR_METADATA=PASS")
              except Exception as err:
                  print("SNAPSHOT_DIR_METADATA_STOP="+type(err).__name__)
          except Exception as err:
              print("SNAPSHOT_INVENTORY_STOP="+type(err).__name__)
              print("SNAPSHOT_INVENTORY_ERRNO="+str(getattr(err,"errno","NONE")))
          PY
      - name: Forget runner SSH identity
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
