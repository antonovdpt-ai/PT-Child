name: Fizira Flower TAR isolated restore rehearsal (one-time)

# Operator authorized one restore into a fresh private Timeweb directory.
# No live frontend writes, changes to permissions, Edge/SQL, or service restart.
# Remove the push trigger as soon as the run is registered.
on:
  push:
    branches:
      - release/flower-frontend-only-20261015
    paths:
      - .github/workflows/flower-restore-test.yml

permissions:
  contents: read

concurrency:
  group: fizira-frontend-production
  cancel-in-progress: false

jobs:
  isolated-restore:
    if: github.repository == 'antonovdpt-ai/PT-Child' && github.ref == 'refs/heads/release/flower-frontend-only-20261015'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed branch, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare static source-pinned, isolated restore payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ops/release/build-flower-restore-payload.py

      - name: Set up existing trusted SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate backup and restore to separate private test directory
        shell: bash
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_PORT: ${{ secrets.TIMEWEB_PORT }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/flower-isolated-restore.py"
          test -n "$TIMEWEB_PORT" && test -n "$TIMEWEB_HOST" && test -n "$TIMEWEB_USER"
          ssh -T -p "$TIMEWEB_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=12 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$TIMEWEB_USER@$TIMEWEB_HOST" 'python3 -B -' \
            < "$RUNNER_TEMP/flower-isolated-restore.py"

      - name: Erase ephemeral runner identity and script
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          rm -f "$RUNNER_TEMP/flower-isolated-restore.py"
