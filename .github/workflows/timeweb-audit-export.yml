name: Timeweb audit export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fizira-frontend-production
  cancel-in-progress: false

jobs:
  safe-code-preflight:
    if: github.ref == 'refs/heads/codex/recovered-session-pdf-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing SSH identity
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read code hashes and Edge status only
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
        run: |
          set -euo pipefail
          ssh -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'SAFE_CODE_PREFLIGHT'
          set -eu
          cd /root/supabase-project
          printf "SAFE_RELEASE_PREFLIGHT_BEGIN\n"
