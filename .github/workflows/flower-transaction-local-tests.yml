name: Flower frontend-only transaction local dry-run (one-time)
# Fictional temporary directories only. No remote SSH and no production secrets.
# Approved local test run registered; no automatic follow-up runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nine-file-transaction:
    if: github.repository == 'antonovdpt-ai/PT-Child' && github.ref == 'refs/heads/release/flower-frontend-only-20261015'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python sources
        run: |
          python3 -m py_compile ops/release/flower-frontend-transaction.py
          python3 -m py_compile ops/release/test_flower_frontend_transaction.py
      - name: Rehearse release and rollback on fictional assets only
        run: |
          python3 -m unittest discover -s ops/release -p 'test_flower_frontend_transaction.py' -v 2>&1 | tee result.log
          grep -Eq 'Ran ([8-9]|[1-9][0-9]+) tests' result.log
          grep -Fqx 'OK' result.log
